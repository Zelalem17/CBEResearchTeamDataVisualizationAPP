name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Using `npm install` instead of `npm ci` here because this repo
      # doesn't have a package-lock.json committed (npm ci requires one).
      # If you later run `npm install` locally and commit the generated
      # package-lock.json, switch this back to `npm ci` and add
      # `cache: "npm"` to the setup-node step above — both give faster,
      # more reproducible installs, but both require that lock file.
      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          # Read from Settings → Secrets and variables → Actions.
          # See .env.example / README.md for how to generate these:
          #   npm run hash-password -- "yourPassword"
          VITE_ADMIN_PASSWORD_HASH: ${{ secrets.VITE_ADMIN_PASSWORD_HASH }}
          VITE_VIEWER_PASSWORD_HASH: ${{ secrets.VITE_VIEWER_PASSWORD_HASH }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
